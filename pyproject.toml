[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "barf-nutri"
dynamic = ["version"]
description = "BARF Nutri: webová aplikace (Django), výpočetní jádro nutricalc a kontrola přepisu tabulek standardů refdata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "django-simple-history==3.13.0",
    "django-axes==8.3.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.170.1", "pytest-django==4.14.0"]

[tool.setuptools]
packages = ["refdata", "nutricalc"]

[tool.setuptools.dynamic]
version = { attr = "refdata.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
django_find_project = false

# Code style: ruff, line length 100 (README, Testy). Run: ruff check . && ruff format --check .
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Written by makemigrations, long lines included.
"**/migrations/*.py" = ["E501"]
# Earlier, independently reviewed packages and their tests (nutricalc, refdata): left as they
# were reviewed. New code follows every rule above.
"nutricalc/**" = ["E501"]
"tests/nutricalc/**" = ["E501", "SIM300"]
"tests/refdata/**" = ["E501", "SIM300"]

[tool.ruff.format]
# docs/ holds Markdown with illustrative code blocks, not code to be formatted.
exclude = ["docs/**", "tests/nutricalc/**", "tests/refdata/**"]

