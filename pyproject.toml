[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "barf-nutri"
dynamic = ["version"]
description = "Kontrola dvojího přepisu tabulek nutričních standardů (FEDIAF 2025) pro aplikaci BARF Nutri"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["refdata"]

[tool.setuptools.dynamic]
version = { attr = "refdata.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
