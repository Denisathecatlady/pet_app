{% load animal_tags %}
<figure class="chart">
  {% include "animals/includes/weight_svg.html" with chart=weight variant="wide" description=weight_description %}
  {% include "animals/includes/weight_svg.html" with chart=weight_compact variant="compact" description=weight_description %}
  <figcaption class="chart__caption">
    {% include "animals/includes/chart_legend.html" with chart=weight legend_label="Legenda grafu hmotnosti" %}
    <p>Zobrazené období: {{ weight.start|short }} – {{ weight.end|short }}.</p>
    {% if change_sentence %}<p class="chart__change">{{ change_sentence }}</p>{% endif %}
    <p class="hint">{{ gap_sentence }}</p>
    <h3>Souhrn za zvolené období</h3>
    <dl class="facts">
      <div><dt>Počet měření</dt><dd>{{ weight.summary.count }}</dd></div>
      <div><dt>První hmotnost</dt><dd>{{ weight.summary.first_kg|kg }} ({{ weight.summary.first_on|short }})</dd></div>
      <div><dt>Poslední hmotnost</dt><dd>{{ weight.summary.last_kg|kg }} ({{ weight.summary.last_on|short }})</dd></div>
      <div><dt>Rozdíl v kilogramech</dt><dd>{{ weight.summary.change_kg_text }}</dd></div>
      <div><dt>Rozdíl v procentech</dt><dd>{{ weight.summary.change_pct_text|default:"nelze určit" }}</dd></div>
      <div><dt>Rozpětí v dnech</dt><dd>{{ weight.summary.days }}</dd></div>
    </dl>
  </figcaption>
</figure>
