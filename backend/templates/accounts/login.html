{% extends "base.html" %}
{% block title %}Přihlášení{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Přihlášení</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "core/includes/form_fields.html" %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit" class="button">Přihlásit se</button>
  </form>
  <ul class="link-list">
    <li><a href="{% url 'accounts:password_reset' %}">Zapomněli jste heslo?</a></li>
    <li><a href="{% url 'accounts:resend_activation' %}">Nepřišel aktivační e-mail?</a></li>
    <li><a href="{% url 'accounts:register' %}">Založit nový účet</a></li>
  </ul>
</div>
{% endblock %}
