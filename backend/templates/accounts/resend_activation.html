{% extends "base.html" %}
{% block title %}Nový aktivační odkaz{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Nový aktivační odkaz</h1>
  <p>Zadejte e-mail, se kterým jste se registrovali.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "core/includes/form_fields.html" %}
    <button type="submit" class="button">Poslat odkaz</button>
  </form>
</div>
{% endblock %}
