{% extends "base.html" %}
{% block title %}Obnova hesla{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Obnova hesla</h1>
  <p>Zadejte e-mail svého účtu. Pošleme na něj odkaz pro nastavení nového hesla.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "core/includes/form_fields.html" %}
    <button type="submit" class="button">Poslat odkaz</button>
  </form>
</div>
{% endblock %}
